<!DOCTYPE html><html lang="th"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JAIRORN</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#07070a;--p:#0f0f14;--p2:#17171e;--ln:#2a2228;--s1:#f5f1f2;--s2:#b9b0b3;--s3:#7d7176;--ac:#ff2d4a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 480px at 50% -6%,#4a0a14 0,#150508 45%,#070709 75%) fixed,#070709;color:var(--s1);font-family:'Kanit',system-ui,sans-serif;min-height:100vh}
.sil{background:linear-gradient(180deg,#fff 0,#ffb3bd 30%,#ff2d4a 58%,#b8001f 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.mt{border:1px solid transparent;background:linear-gradient(160deg,#2a1219 0,#101015 45%,#0b0b10 100%) padding-box,linear-gradient(135deg,#ff6a7e,#5e0e1b 45%,#ff2d4a) border-box}
nav{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid #5a0f1c;box-shadow:0 1px 22px #ff2d4a33;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);background:rgba(7,7,9,.88);backdrop-filter:blur(10px);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;letter-spacing:.22em;margin-right:auto}
.lg{width:38px;height:38px;border-radius:50%;object-fit:cover;display:grid;place-items:center;font-size:16px}
.tabs{display:flex;gap:6px}
.tb,.btn{font-family:inherit;border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer;color:var(--s2);background:transparent;border:1px solid var(--ln);transition:.15s}
.tb:hover,.btn:hover{border-color:var(--ac);color:#fff}
.tb.on{color:#fff;background:linear-gradient(180deg,#ff5a70 0,#e0102e 48%,#9c0018 52%,#c30a26 100%);border-color:#ff5a70;font-weight:600;box-shadow:0 4px 16px #ff2d4a55,inset 0 1px 0 #ffffff66}
.btn.go{color:#fff;background:linear-gradient(180deg,#ff5a70 0,#e0102e 48%,#9c0018 52%,#c30a26 100%);border-color:#ff5a70;font-weight:600;box-shadow:0 4px 16px #ff2d4a55,inset 0 1px 0 #ffffff66}.btn.go:hover{color:#fff;filter:brightness(1.1)}
.btn.rd{color:#ff6b7f}
.btn.sm{padding:4px 10px;font-size:12px}
main{max-width:980px;margin:0 auto;padding:34px 20px 70px}
.hero{text-align:center;margin-bottom:38px}
.hero h1{font-size:clamp(34px,7vw,64px);letter-spacing:.2em;margin:0;font-weight:700}
.tl{display:block;margin:0 auto;max-width:min(520px,88%);height:auto;filter:drop-shadow(0 0 20px #ff2d4a66)}
.tag{color:var(--ac);letter-spacing:.3em;font-size:13px;margin:6px 0 12px}
.ab{color:var(--s2);max-width:560px;margin:0 auto;line-height:1.7;font-weight:300;white-space:pre-wrap}
.tier{position:relative;text-align:center;margin-bottom:30px}
.tier+.tier::before{content:"";position:absolute;left:50%;top:-30px;height:30px;width:1px;background:linear-gradient(#0000,#ff2d4a)}
.tier h2{display:inline-block;margin:0 0 16px;font-size:13px;letter-spacing:.34em;font-weight:500;color:var(--s2);padding:5px 18px;border:1px solid var(--ln);border-radius:30px;background:var(--p)}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.card{border-radius:14px;padding:18px 14px;text-align:center;width:150px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 12px 32px #000a,0 0 24px #ff2d4a14,inset 0 1px 0 #ffffff14}
.card.t0{width:210px;padding:24px 16px}.card.t1{width:176px}
.av{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--p2);border:2px solid #ff2d4a99;display:grid;place-items:center;font-size:24px;font-weight:600;color:#ffd3d9;overflow:hidden;box-shadow:0 0 14px #ff2d4a44}
.t0 .av{width:100px;height:100px;font-size:38px}.t1 .av{width:82px;height:82px}
.card b{font-weight:500;font-size:15px;word-break:break-word}
.fb{font-size:12px;color:var(--ac);text-decoration:none;border:1px solid #7a1626;border-radius:20px;padding:3px 12px}
.fb:hover{background:#2a0a10;color:#fff}
.srch{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.srch input{flex:1;min-width:180px}
input,select,textarea{font-family:inherit;background:var(--p2);color:var(--s1);border:1px solid var(--ln);border-radius:8px;padding:9px 12px;font-size:14px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.pl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.mr{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--ln)}
.mr .av{width:46px;height:46px;font-size:17px;flex-shrink:0}
.mr div.i{flex:1;min-width:0}.mr small{display:block;color:var(--s3)}
.pn{border-radius:12px;padding:18px;margin-bottom:18px}
.pn h3{margin:0 0 14px;font-weight:600;font-size:16px;letter-spacing:.08em}
.fr{display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.fr>*{flex:1;min-width:130px}.fr>.btn{flex:0 0 auto;min-width:0}
.lb{font-size:12px;color:var(--s3);margin:10px 0 4px;display:block}
.em{text-align:center;color:var(--s3);padding:40px 0}
.bar{position:sticky;bottom:12px;display:flex;gap:10px;justify-content:center;padding:12px;border-radius:12px;background:#0f0f14ee;border:1px solid #7a1626;margin-top:10px}
@media(max-width:560px){.card{width:44%}.card.t0{width:80%}.card.t1{width:60%}}

(function(){
const HEAD=document.head.innerHTML,$=s=>document.querySelector(s),A=$('#app');
let D=JSON.parse($('#data').textContent),tab='dash',q='',cat='all',own=false;
const uid=()=>Math.random().toString(36).slice(2,9);
const E=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=u=>/^https?:\/\//i.test(u||'')?E(u):'';
const av=(m,c)=>m.img?`<img class="av ${c||''}" src="${m.img}" alt="">`:`<div class="av">${E((m.name||'?').trim().charAt(0).toUpperCase())}</div>`;
const fbl=m=>url(m.fb)?`<a class="fb" href="${url(m.fb)}" target="_blank" rel="noopener">Facebook</a>`:'';
const rn=id=>(D.roles.find(r=>r.id===id)||{}).name||'';
function img(f,max,png){return new Promise(ok=>{const r=new FileReader();r.onload=e=>{const i=new Image();i.onload=()=>{let w=i.width,h=i.height,k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);ok(c.toDataURL(png?'image/png':'image/jpeg',.8))};i.src=e.target.result};r.readAsDataURL(f)})}
function nav(){const t=(k,l)=>`<button class="tb ${tab===k?'on':''}" data-a="tab" data-t="${k}">${l}</button>`;
return `<nav><div class="brand sil">${D.logo?`<img class="lg" src="${D.logo}" alt="">`:''}${E(D.name)}</div><div class="tabs">${t('dash','Dashboard')}${t('roster','รายชื่อ')}${own?t('dev','DEV'):''}</div></nav>`}
function hero(){return `<div class="hero">${D.titleImg?`<img class="tl" src="${D.titleImg}" alt="${E(D.name)}">`:`<h1 class="sil">${E(D.name)}</h1>`}<div class="tag">${E(D.tagline)}</div><div class="ab">${E(D.about)}</div></div>`}
function dash(){return hero()+D.roles.map((r,i)=>{const ms=D.members.filter(m=>m.role===r.id);
return `<section class="tier"><h2>${E(r.name)}</h2><div class="row">${ms.map(m=>`<div class="card mt t${Math.min(i,2)}">${av(m)}<b>${E(m.name)}</b>${fbl(m)}</div>`).join('')||'<span class="em" style="padding:10px">—</span>'}</div></section>`}).join('')}
function rows(){const s=q.trim().toLowerCase(),l=D.members.filter(m=>(cat==='all'||m.role===cat)&&m.name.toLowerCase().includes(s));
return l.map(m=>`<div class="mr">${av(m)}<div class="i"><b>${E(m.name)}</b><small>${E(rn(m.role))}</small></div>${fbl(m)}</div>`).join('')||'<div class="em">ไม่พบรายชื่อ</div>'}
function roster(){return `<div class="hero"><h1 class="sil" style="font-size:34px">รายชื่อสมาชิก</h1></div><div class="srch"><input id="q" placeholder="ค้นหาชื่อสมาชิก..." value="${E(q)}"></div><div class="pl"><button class="tb ${cat==='all'?'on':''}" data-a="cat" data-t="all">ทั้งหมด</button>${D.roles.map(r=>`<button class="tb ${cat===r.id?'on':''}" data-a="cat" data-t="${r.id}">${E(r.name)}</button>`).join('')}</div><div id="list">${rows()}</div>`}
function dev(){
const up=(a,i)=>`<button class="btn sm" data-a="${a}u" data-i="${i}">↑</button><button class="btn sm" data-a="${a}d" data-i="${i}">↓</button>`;
return `<div class="pn mt"><h3 class="sil">ข้อมูลเว็บไซต์</h3><label class="lb">ชื่อเว็บ</label><input data-f="name" value="${E(D.name)}"><label class="lb">แท็กไลน์</label><input data-f="tagline" value="${E(D.tagline)}"><label class="lb">อธิบายครอบครัว</label><textarea rows="3" data-f="about">${E(D.about)}</textarea><label class="lb">โลโก้ (แนบรูป)</label><div class="fr">${D.logo?`<img class="lg" src="${D.logo}">`:''}<input type="file" accept="image/*" data-f="logo" data-sz="300"></div><label class="lb">โลโก้ชื่อเว็บ (แทนตัวอักษรชื่อเว็บในหน้าแรก)</label><div class="fr">${D.titleImg?`<img src="${D.titleImg}" style="height:56px;flex:0 0 auto;min-width:0">`:''}<input type="file" accept="image/*" data-f="titleImg" data-sz="900">${D.titleImg?'<button class="btn sm rd" data-a="tx">ลบโลโก้</button>':''}</div></div>
<div class="pn mt"><h3 class="sil">ตำแหน่ง (เรียงจากบนลงล่าง)</h3>${D.roles.map((r,i)=>`<div class="fr"><input data-rn="${i}" value="${E(r.name)}">${up('r',i)}<button class="btn sm rd" data-a="rx" data-i="${i}">ลบ</button></div>`).join('')}<button class="btn" data-a="ra">+ เพิ่มตำแหน่ง</button></div>
<div class="pn mt"><h3 class="sil">สมาชิก (${D.members.length})</h3><button class="btn go" data-a="ma">+ เพิ่มสมาชิก</button>${D.members.map((m,i)=>`<div class="fr" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--ln)">${av(m)}<input data-mi="${i}" data-mk="name" placeholder="ชื่อ" value="${E(m.name)}"><select data-mi="${i}" data-mk="role">${D.roles.map(r=>`<option value="${r.id}" ${r.id===m.role?'selected':''}>${E(r.name)}</option>`).join('')}</select><input data-mi="${i}" data-mk="fb" placeholder="ลิงก์ Facebook https://..." value="${E(m.fb)}"><input type="file" accept="image/*" data-mi="${i}" data-sz="240">${up('m',i)}<button class="btn sm rd" data-a="mx" data-i="${i}">ลบ</button></div>`).join('')}</div>
<div class="bar"><button class="btn go" data-a="save">บันทึกและเผยแพร่</button><button class="btn" data-a="reset">ยกเลิกการแก้ไข</button></div>`}
function ui(){A.innerHTML=nav()+'<main>'+(tab==='dev'&&own?dev():tab==='roster'?roster():dash())+'</main>'}
const mv=(a,i,d)=>{const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]};
A.addEventListener('input',e=>{const t=e.target,d=t.dataset;
if(d.f&&t.type!=='file')D[d.f]=t.value;else if(d.rn!=null)D.roles[d.rn].name=t.value;else if(d.mk)D.members[d.mi][d.mk]=t.value;else if(t.id==='q'){q=t.value;$('#list').innerHTML=rows()}});
A.addEventListener('change',async e=>{const t=e.target,d=t.dataset;if(t.type==='file'&&t.files[0]){const u=await img(t.files[0],+d.sz,d.f==='titleImg');if(d.f)D[d.f]=u;else D.members[d.mi].img=u;ui()}});
A.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i;
if(a==='tab'){tab=b.dataset.t}else if(a==='cat'){cat=b.dataset.t}
else if(a==='ru')mv(D.roles,i,-1);else if(a==='rd')mv(D.roles,i,1);
else if(a==='ra')D.roles.push({id:uid(),name:'ตำแหน่งใหม่'});
else if(a==='rx'){if(D.roles.length<2)return;const id=D.roles[i].id;D.roles.splice(i,1);D.members.forEach(m=>{if(m.role===id)m.role=D.roles[0].id})}
else if(a==='mu')mv(D.members,i,-1);else if(a==='md')mv(D.members,i,1);
else if(a==='ma')D.members.unshift({id:uid(),name:'',role:D.roles[D.roles.length-1].id,fb:'',img:''});
else if(a==='mx'){if(!confirm('ลบสมาชิกนี้?'))return;D.members.splice(i,1)}
else if(a==='tx'){D.titleImg=''}
else if(a==='reset'){D=JSON.parse($('#data').textContent)}
else if(a==='save'){await save();return}
ui()});
async function save(){const art=window.claude&&await claude.use('artifact');if(!art){alert('บันทึกไม่ได้ในหน้านี้');return}
D.members=D.members.filter(m=>m.name.trim());
const j=JSON.stringify(D).replace(/</g,'\\u003c');
const html='<!DOCTYPE html><html lang="th"><head>'+HEAD+'</head><body><div id="app"></div><script id="data" type="application/json">'+j+'<\/script><script id="code">'+$('#code').textContent+'<\/script></body></html>';
try{await art.publish(html)}catch(x){alert('บันทึกไม่สำเร็จ: '+(x.code||x.message))}}
ui();
if(window.claude)claude.use('user').then(u=>{if(u&&u.isOwner()){own=true;ui()}}).catch(()=>{});
})();
</script></body></html>
